name: auto-merge-test-to-main

# 自动 CD：当 test 分支的 4 个 CI gate（lint/frontend-gate/frontend-e2e/coverage）
# 全部通过后，把 test 以快进方式合并进 main，从而触发 deploy-production 自动部署 ECS。
#
# 触发：
#   - workflow_run：上述 4 个 gate 在 test 上跑完（completed）即触发本流程；
#     本 job 会轮询直到 4 个 gate 对该 SHA 全部 completed，并校验全部 success 才合并。
#   - workflow_dispatch：手动触发（用于回补/重跑，可选填 sha）。
#
# 安全约束：
#   - 仅快进（--ff-only），若 main 与 test 分叉（main 有 test 不含的提交）则中止，需人工介入；
#   - 幂等：若 main 已包含该 SHA 则跳过，避免多次触发重复合并；
#   - 合并失败（如并发推送冲突）会重试一次，仍失败则退出非零，不强制。

on:
  workflow_run:
    workflows: [lint-gate, frontend-gate, frontend-e2e, coverage-gate]
    types: [completed]
    branches: [test]
  workflow_dispatch:
    inputs:
      sha:
        description: "要合并进 main 的 test 提交 SHA（默认取 test 当前 HEAD）"
        required: false

permissions:
  contents: write

concurrency:
  group: auto-merge-test-to-main
  cancel-in-progress: false

jobs:
  merge:
    name: Fast-forward main to test after green CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_run 触发时只在触发 gate 自己成功才继续；其余 gate 在轮询中校验。
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    steps:
      - name: Checkout (full history, write token)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve target SHA
        id: target
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.sha }}" ]; then
            echo "sha=${{ inputs.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(gh api repos/${{ github.repository }}/commits/test --jq '.sha')" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Wait for all 4 gates green for SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
          GATES: "lint-gate frontend-gate frontend-e2e coverage-gate"
        run: |
          set -euo pipefail
          echo "Checking gates for SHA=$SHA"
          for i in $(seq 1 60); do
            all_done=1
            while IFS= read -r g; do
              [ -z "$g" ] && continue
              line=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
                       --jq ".workflow_runs[] | select(.name==\"$g\") | \"\(.status)\t\(.conclusion)\"" | tail -1)
              status="${line%%$'	'*}"
              echo "  [$i] $g -> status=${status:-missing}"
              if [ "$status" != "completed" ]; then all_done=0; fi
            done <<< "$GATES"
            [ "$all_done" -eq 1 ] && break
            sleep 10
          done
          # 最终校验：全部 success
          rc=0
          while IFS= read -r g; do
            [ -z "$g" ] && continue
            line=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
                     --jq ".workflow_runs[] | select(.name==\"$g\") | \"\(.status)\t\(.conclusion)\"" | tail -1)
            concl="${line##*$'\t'}"
            echo "  final $g -> conclusion=${concl:-missing}"
            [ "$concl" = "success" ] || { echo "  ABORT: $g is '$concl', not success"; rc=1; }
          done <<< "$GATES"
          exit $rc

      - name: Fast-forward main to test
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin --quiet
          git checkout -B main origin/main
          # 幂等：main 已含该 SHA 则跳过
          if git merge-base --is-ancestor "$SHA" main; then
            echo "main already contains $SHA; nothing to do."
            exit 0
          fi
          # 安全：仅快进，分叉则中止
          if ! git merge-base --is-ancestor origin/main origin/test; then
            echo "ERROR: origin/main is not an ancestor of origin/test; cannot fast-forward. Manual intervention required." >&2
            exit 1
          fi
          for attempt in 1 2; do
            git merge --ff-only origin/test && break
            echo "merge attempt $attempt failed; re-fetching and retrying"
            git fetch origin --quiet
            git checkout -B main origin/main
          done
          git push origin main
          echo "main fast-forwarded to test@$SHA"
