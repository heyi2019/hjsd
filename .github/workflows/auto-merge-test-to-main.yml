name: auto-merge-test-to-main

# 触发：每次 push 到 test 分支（即 dev 推上来）
# 设计前提：main 已启用原生分支保护（Require PR + 必填 lint/frontend/coverage
#           状态检查）。因此本工作流不再直推 main（会被保护规则拦截），
#           改为经 PR(test->main) 承载合并，由 GitHub 在合并时强制执行保护。
# 流程：
#   ① 幂等找到/创建 test->main 的开放 PR；
#   ② 轮询 3 个 CI gate（lint/frontend/coverage）在 PR 头提交（=test 顶端）全绿；
#   ③ gh pr merge --merge（走 PR 合并，受分支保护约束：必填检查须绿、PR 须最新）；
#   ④ 显式拉起 deploy-production（GITHUB_TOKEN 推 main 不会自动触发
#      下游 push 事件 workflow，须用 API 触发）。
# 安全：绝不强推；任一 gate 失败即中止，绝不强制合并；
#       幂等（test 已合入 main 则跳过）；PR 合并保留 --no-ff 式合并提交。
# 注意：frontend-e2e 已随 E2E 体系整体下线（2026-11-02），勿再加回。
on:
  push:
    branches: [test]

permissions:
  contents: write        # 读仓库 + 触发部署 workflow
  pull-requests: write   # 创建/合并 PR
  actions: write         # 轮询其他 workflow run + gh workflow run 触发部署

jobs:
  wait-and-merge:
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.sha }}
    steps:
      - name: Checkout (full history for merge)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Idempotent — ensure PR test -> main exists
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 已合入则跳过（避免重复部署）
          if git merge-base --is-ancestor origin/test origin/main; then
            echo "test already merged into main; nothing to do"
            echo "merged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 复用已存在的开放 PR，避免重复创建
          existing=$(gh pr list --base main --head test --state open \
            --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            echo "reusing existing PR #$existing"
            echo "pr_number=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 可能刚被并发创建，create 失败则回退到再查一次
          num=$(gh pr create --base main --head test \
            --title "auto-merge: test -> main (CI gates green)" \
            --body "自动合并分支。由 auto-merge-test-to-main 工作流在 3 个 CI gate 全绿后合并。" \
            --json number --jq '.number' 2>/dev/null) || {
              num=$(gh pr list --base main --head test --state open \
                --json number --jq '.[0].number' 2>/dev/null || true)
          }
          if [ -z "$num" ]; then
            echo "failed to create or find PR — aborting"; exit 1
          fi
          echo "created/reused PR #$num"
          echo "pr_number=$num" >> "$GITHUB_OUTPUT"

      - name: Wait for all 3 CI gates to be green (PR head = test tip)
        if: steps.pr.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for wf in lint-gate.yml frontend-gate.yml coverage-gate.yml; do
            echo "waiting for $wf ..."
            ok=""
            for i in $(seq 1 80); do
              st=$(gh run list --commit "$SHA" --workflow "$wf" --limit 1 \
                --json conclusion --jq '.[0].conclusion' 2>/dev/null || true)
              if [ "$st" = "success" ]; then ok=1; break; fi
              if [ "$st" = "failure" ] || [ "$st" = "cancelled" ] || [ "$st" = "timed_out" ]; then
                echo "$wf: $st — aborting auto-merge"; exit 1
              fi
              sleep 15
            done
            if [ -z "$ok" ]; then
              echo "$wf not green after timeout — aborting"; exit 1
            fi
            echo "$wf: success"
          done
          echo "ALL 3 GATES GREEN for $SHA"

      - name: Merge PR test -> main (via PR, respects branch protection)
        if: steps.pr.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          num="${{ steps.pr.outputs.pr_number }}"
          # 分支保护在此强制：必填状态检查须全绿、PR 须最新、须为 PR 合并。
          gh pr merge "$num" --merge --delete-branch=false
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Trigger production deploy
        if: steps.pr.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "triggering deploy-production on main ..."
          gh workflow run deploy-production.yml --ref main
          echo "deploy-production dispatched"
