name: backend-gate

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Run the full backend CI suite instead of changed-area tests"
        required: false
        type: boolean
        default: false
      changed_paths:
        description: "Comma-separated changed paths from the original push (set by main-ci-cd)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      release_sha:
        required: true
        type: string
      full_suite:
        required: false
        type: boolean
        default: false
      changed_paths:
        required: false
        type: string
        default: ""

jobs:
  backend-tests:
    # main/master 由 main-ci-cd 调用；PR、dev push 和手动触发照常执行。
    if: ${{ inputs.release_sha || github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_app
          POSTGRES_PASSWORD: erp_app
          POSTGRES_DB: heijin_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_app"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # 普通 runner（非 container job）里 services.postgres 只能通过映射端口访问，
      # 主机名 postgres 无法解析；CI 必须用 127.0.0.1。
      # DATABASE_URL 也必须给：test_numbering.test_concurrent_allocation_is_unique
      # 读 Settings.alembic_url（= database_url）去 CREATE DATABASE 探针库，
      # 不注入时会落到无密码的缺省开发地址，报 fe_sendauth: no password supplied。
      # CI 的 postgres service 是一次性单库，conftest 对「两变量同库」的拒绝已在 CI 下豁免。
      DATABASE_URL: "postgresql+psycopg://erp_app:erp_app@127.0.0.1:5432/heijin_erp_test"
      TEST_DATABASE_URL: "postgresql+psycopg://erp_app:erp_app@127.0.0.1:5432/heijin_erp_test"
      TEST_REDIS_URL: "redis://127.0.0.1:6379/0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Verify release commit
        if: ${{ inputs.release_sha }}
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements.lock.txt
            backend/requirements-dev.lock.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock.txt

      # 依赖口径正确性门禁：requirements.txt 改了但 lock 没重算 → 生产装的是 lock，改动白费。
      # 复现命令须与 lock 头注释逐字一致：仓库根执行、输出到 lock 路径本身（复用已 pin 版本保幂等，
      # 输出临时路径会重新解析传递依赖致 diff 恒非空）、--no-emit-index-url 防止把 runner 源写进注释。
      # pip-tools 已随 requirements-dev.txt 装入；境外 runner 用默认 pypi.org（本机实测 diff 空 ~7s，
      # 切勿用阿里云镜像，境外访问反而不稳）。
      - name: Verify requirements.lock.txt is in sync
        run: |
          cp backend/requirements.lock.txt /tmp/req.lock.expected
          pip-compile --no-emit-index-url \
            --output-file=backend/requirements.lock.txt --strip-extras \
            backend/requirements.txt
          if ! diff -u /tmp/req.lock.expected backend/requirements.lock.txt; then
            echo "::error::requirements.lock.txt 与 requirements.txt 不同步；请在仓库根重跑 pip-compile --no-emit-index-url --output-file=backend/requirements.lock.txt --strip-extras backend/requirements.txt" >&2
            exit 1
          fi
          echo "lock 一致性校验通过"

      - name: Verify requirements-dev.lock.txt is in sync
        run: |
          cp backend/requirements-dev.lock.txt /tmp/req-dev.lock.expected
          pip-compile --no-emit-index-url --allow-unsafe \
            --constraint backend/requirements.lock.txt \
            --output-file=backend/requirements-dev.lock.txt --strip-extras \
            backend/requirements-dev.txt
          if ! diff -u /tmp/req-dev.lock.expected backend/requirements-dev.lock.txt; then
            echo "::error::requirements-dev.lock.txt 与依赖声明不同步，请重新生成开发依赖锁文件" >&2
            exit 1
          fi

      - name: Prepare test configuration
        run: cp .env.example .env

      - name: Verify shared customer rate limiting
        working-directory: backend
        run: python -m pytest ../tests/backend/integration/system/test_ratelimit.py -q -k TestRateLimiter

      # 基线一致性门禁：「改 ORM 即改基线」策略的静默失败模式是 ORM 与 alembic 0001 漂移
      # （测试库 create_all 全绿、生产 alembic 缺列）。本步骤建临时 drill 库跑 alembic upgrade head，
      # 再与 Base.metadata 比对（等价于比对 create_all），差异非空即红。
      # 本地同款校验：bash scripts/check_baseline.sh（BASE_URL 未指定时读根 .env）。
      - name: Verify alembic baseline matches ORM
        working-directory: backend
        env:
          BASE_URL: "postgresql+psycopg://erp_app:erp_app@127.0.0.1:5432"
        run: bash scripts/check_baseline.sh

      # 发版使用调用方传入的原始 push 范围；dev / PR 使用事件的 base 和 head。
      # 无法确定完整范围时运行全量，避免静默漏测。
      - name: Determine test scope (分层策略)
        id: scope
        env:
          CI_CHANGED_PATHS: ${{ inputs.changed_paths || '' }}
          CI_FULL_SUITE: ${{ inputs.full_suite || 'false' }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: python scripts/ops/ci_test_scope.py >> "$GITHUB_OUTPUT"

      # CI 走串行：--parallel 会让每个 xdist worker 各自建库，在 GitHub runner 上
      # 曾因连接失败触发 worker_errordown / KeyError: WorkerController 使整轮 INTERNALERROR。
      # 本地仍可用 --parallel 提速；CI 以稳定为准。
      - name: Run backend regression (分层)
        working-directory: backend
        env:
          CHANGED_PATHS: ${{ steps.scope.outputs.changed_paths }}
        run: |
          python run_regression.py lint
          if [[ "${{ steps.scope.outputs.mode }}" == "changed" ]]; then
            echo "=== 执行分组: changed ==="
            python run_regression.py changed --backend-only \
              --changed-paths "$CHANGED_PATHS" || exit 1
          else
            for g in ${{ steps.scope.outputs.groups }}; do
              echo "=== 执行分组: $g ==="
              python run_regression.py "$g" --backend-only || exit 1
            done
          fi

      - name: Generate test case library + report
        working-directory: backend
        run: |
          python scripts/gen_test_case_library.py
          python scripts/make_test_report.py

      - name: Upload case library & report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: |
            docs/testing/测试用例库.csv
            docs/testing/测试用例库.md
            docs/testing/测试报告_*.md
            docs/testing/测试报告_*.json
            docs/testing/测试结果库/results.jsonl
          retention-days: 7
