name: backend-gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Run the full backend CI suite instead of changed-area tests"
        required: false
        type: boolean
        default: false
      changed_paths:
        description: "Comma-separated changed paths from the original push (set by main-ci-cd)"
        required: false
        type: string
        default: ""

jobs:
  backend-tests:
    # main/master 的 push 由 main-ci-cd 在 release sha 上统一 dispatch 门禁；
    # 这里再跑一遍只是重复计算。PR 与手动 dispatch 仍照常执行。
    if: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_app
          POSTGRES_PASSWORD: erp_app
          POSTGRES_DB: heijin_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_app"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # 普通 runner（非 container job）里 services.postgres 只能通过映射端口访问，
      # 主机名 postgres 无法解析；CI 必须用 127.0.0.1。
      # DATABASE_URL 也必须给：test_numbering.test_concurrent_allocation_is_unique
      # 读 Settings.alembic_url（= database_url）去 CREATE DATABASE 探针库，
      # 不注入时会落到无密码的缺省开发地址，报 fe_sendauth: no password supplied。
      # CI 的 postgres service 是一次性单库，conftest 对「两变量同库」的拒绝已在 CI 下豁免。
      DATABASE_URL: "postgresql+psycopg://erp_app:erp_app@127.0.0.1:5432/heijin_erp_test"
      TEST_DATABASE_URL: "postgresql+psycopg://erp_app:erp_app@127.0.0.1:5432/heijin_erp_test"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements.lock.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare test configuration
        run: cp .env.example .env

      # main-ci-cd 在 release sha 上 dispatch 本门禁，并注入「原始 push 范围」路径集。
      # CI checkout 后 git status 恒为空，不能靠脚本自己读工作区。
      - name: Determine test scope (分层策略)
        id: scope
        env:
          INJECTED_PATHS: ${{ inputs.changed_paths || '' }}
          FULL_SUITE: ${{ inputs.full_suite || 'false' }}
        run: |
          if [[ "$FULL_SUITE" == "true" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "groups=ci" >> "$GITHUB_OUTPUT"          # 手动 full_suite：全量回归
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${INJECTED_PATHS:-}" ]]; then
            echo "mode=changed" >> "$GITHUB_OUTPUT"       # 发版轮：按原始 push 范围选测
            echo "groups=" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]] \
            || [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "groups=ci" >> "$GITHUB_OUTPUT"          # 手动 dispatch 未带路径 / 主分支：全量
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "groups=unit cross B C D" >> "$GITHUB_OUTPUT"  # PR：单元 + 核心集成 + 跨模块
          fi
          echo "scope mode=$(grep '^mode=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"

      # CI 走串行：--parallel 会让每个 xdist worker 各自建库，在 GitHub runner 上
      # 曾因连接失败触发 worker_errordown / KeyError: WorkerController 使整轮 INTERNALERROR。
      # 本地仍可用 --parallel 提速；CI 以稳定为准。
      - name: Run backend regression (分层)
        working-directory: backend
        env:
          INJECTED_PATHS: ${{ inputs.changed_paths || '' }}
        run: |
          python run_regression.py lint
          if [[ "${{ steps.scope.outputs.mode }}" == "changed" ]]; then
            echo "=== 执行分组: changed（main-ci-cd 注入原始 push 范围）==="
            python run_regression.py changed --backend-only \
              --changed-paths "$INJECTED_PATHS" || exit 1
          else
            for g in ${{ steps.scope.outputs.groups }}; do
              echo "=== 执行分组: $g ==="
              python run_regression.py "$g" --backend-only || exit 1
            done
          fi

      - name: Generate test case library + report
        working-directory: backend
        run: |
          python scripts/gen_test_case_library.py
          python scripts/make_test_report.py

      - name: Upload case library & report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: |
            docs/testing/测试用例库.csv
            docs/testing/测试用例库.md
            docs/testing/测试报告_*.md
            docs/testing/测试报告_*.json
            docs/testing/测试结果库/results.jsonl
          retention-days: 7
