name: backend-gate

on:
  push:
    branches: [main, master, test]
    paths:
      - "backend/**"
      - ".github/workflows/backend-gate.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_app
          POSTGRES_PASSWORD: erp_app
          POSTGRES_DB: heijin_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: "postgresql+psycopg://erp_app:erp_app@postgres:5432/heijin_erp_test"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Determine test scope (分层策略)
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "groups=ci" >> "$GITHUB_OUTPUT"      # 手动触发：全量回归
          elif [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_name }}" = "master" ]; then
            echo "groups=ci" >> "$GITHUB_OUTPUT"      # 发布前：全系统回归 + 高风险跨模块
          else
            echo "groups=unit cross B C D" >> "$GITHUB_OUTPUT"  # PR/test：单元 + 核心集成 + 跨模块
          fi

      # 回归默认走 pytest-xdist 并行（--parallel）：每个 worker 由 conftest 自动建
      # 独立库、退出时回收，默认串行行为不变。本地实测 ci 全量 1684 passed
      # ~99s → 51s（约 -48%）。lint 不是 pytest，不加该开关。
      - name: Run backend regression (分层)
        working-directory: backend
        run: |
          python run_regression.py lint
          for g in ${{ steps.scope.outputs.groups }}; do
            echo "=== 执行分组: $g ==="
            python run_regression.py "$g" --backend-only --parallel || exit 1
          done

      - name: Generate test case library + report
        working-directory: backend
        run: |
          python scripts/gen_test_case_library.py
          python scripts/make_test_report.py

      - name: Upload case library & report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-report
          path: |
            docs/testing/测试用例库.csv
            docs/testing/测试用例库.md
            docs/testing/测试报告.md
            docs/testing/测试报告.json
            docs/testing/测试结果库/results.jsonl
          retention-days: 30
