name: codeup-test-mirror

# GitHub 是 CI 主线；Codeup 只接收 GitHub test 上全部必需检查通过的同一版本。
# Codeup main 保持保护状态，不在 CI 中绕过保护直接推送。
on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-github-test:
    name: Verify GitHub test checks
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
    steps:
      - id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head_sha="$HEAD_SHA"
          required_workflows=(coverage-gate frontend-gate frontend-e2e lint-gate)
          for attempt in {1..60}; do
            runs_json="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head_sha}&per_page=100")"
            all_success=true
            for workflow_name in "${required_workflows[@]}"; do
              state="$(jq -r --arg name "$workflow_name" '
                [.workflow_runs[] | select(.name == $name and .event == "push" and .head_branch == "test")]
                | sort_by(.updated_at) | last | if . == null then "missing" elif .status != "completed" then "running" else (.conclusion // "unknown") end' <<<"$runs_json")"
              echo "${workflow_name}: ${state}"
              case "$state" in
                success) ;;
                missing|running) all_success=false ;;
                *)
                  echo "${workflow_name} failed with ${state}; Codeup mirror was not updated."
                  echo "ready=false" >> "$GITHUB_OUTPUT"
                  exit 1
                  ;;
              esac
            done
            if [[ "$all_success" == true ]]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
              {
                echo "### GitHub test checks passed"
                echo
                echo "All required workflows passed for ${head_sha}."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if (( attempt < 60 )); then sleep 30; fi
          done

          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "Timed out waiting for GitHub test checks; Codeup mirror was not updated."
          exit 1

  check-configuration:
    name: Check Codeup mirror configuration
    needs: verify-github-test
    if: needs.verify-github-test.outputs.ready == 'true'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CODEUP_USERNAME: ${{ secrets.CODEUP_USERNAME }}
          CODEUP_TOKEN: ${{ secrets.CODEUP_TOKEN }}
        run: |
          if [[ -n "$CODEUP_USERNAME" && -n "$CODEUP_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Codeup mirror not configured"
              echo
              echo "Add repository secrets CODEUP_USERNAME and CODEUP_TOKEN to enable automatic test-branch mirroring."
              echo "Existing GitHub CI remains unaffected."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  mirror-test:
    name: Mirror test to Codeup
    needs: [verify-github-test, check-configuration]
    if: needs.check-configuration.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Push the verified GitHub test commit to Codeup test
        env:
          CODEUP_USERNAME: ${{ secrets.CODEUP_USERNAME }}
          CODEUP_TOKEN: ${{ secrets.CODEUP_TOKEN }}
          CODEUP_REPOSITORY: https://hjsd-cn-hangzhou.devops.aliyuncs.com/codeup/hjsd/hjsd.git
        run: |
          set -euo pipefail
          # The credentials are supplied only to this process and never written to the repository.
          git init --quiet
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth=1 origin "${{ needs.verify-github-test.outputs.head_sha }}"
          git checkout --quiet --detach FETCH_HEAD
          git remote add codeup "https://${CODEUP_USERNAME}:${CODEUP_TOKEN}@${CODEUP_REPOSITORY#https://}"
          git push codeup "HEAD:refs/heads/test"

