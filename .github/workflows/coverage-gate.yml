name: coverage-gate

on:
  push:
    branches: [main, master, test]
  pull_request:
  workflow_dispatch:

jobs:
  coverage:
    # 与 Dockerfile 保持一致：python:3.12-slim（pandas/numpy 预编译 wheel 最稳）
    runs-on: ubuntu-latest
    # SQLite 通道已下线，测试夹具（tests/backend/conftest.py）强制要求
    # PostgreSQL 且库名必须含 test，否则在 collect 期直接 exit。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: heijin_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_user -d heijin_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 环境变量优先于 .env，双写避免 .env.example 的占位密码生效
      DATABASE_URL: postgresql+psycopg://erp_user:ci-password@127.0.0.1:5432/heijin_erp_test
      TEST_DATABASE_URL: postgresql+psycopg://erp_user:ci-password@127.0.0.1:5432/heijin_erp_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Prepare isolated CI environment
        run: |
          rm -f .env
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path

          env_file = Path(".env")
          content = env_file.read_text(encoding="utf-8")
          content = content.replace(
              "JWT_SECRET_KEY=replace-with-a-random-secret-at-least-32-characters",
              "JWT_SECRET_KEY=ci-test-secret-0123456789-abcdef",
          )
          # 占位密码不能用于 service，显式覆盖为 CI 凭据
          database_url = (
              "postgresql+psycopg://erp_user:ci-password@127.0.0.1:5432/heijin_erp_test"
          )
          lines = [
              f"DATABASE_URL={database_url}"
              if line.startswith("DATABASE_URL=")
              else line
              for line in content.splitlines()
          ]
          env_file.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Verify PostgreSQL connectivity
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          url = os.environ["DATABASE_URL"]
          assert "test" in url.rsplit("/", 1)[-1], f"CI 库名必须含 test：{url}"
          engine = create_engine(url)
          with engine.connect() as connection:
              print("PostgreSQL:", connection.execute(text("select version()")).scalar())
          engine.dispose()
          PY

      - name: Run coverage gate
        working-directory: backend
        run: python run_coverage_gate.py
