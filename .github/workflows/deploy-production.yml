name: deploy-production

# 仅由 main-ci-cd 在三个门禁全绿后 dispatch；也保留手动触发用于补发/回滚验证。
on:
  workflow_dispatch:
    inputs:
      reset_database:
        description: "Recreate the production PostgreSQL volume from the current 0001 baseline"
        required: false
        type: boolean
        default: false
      release_sha:
        description: "Exact commit approved by main-ci-cd"
        required: false
        type: string
        default: ""
      wait_for_gates:
        description: "Wait for the three CI gates before uploading to ECS (set by main-ci-cd)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  # type=gha 缓存走 GitHub Actions Cache API；显式声明 permissions 后未列出的项默认 none，
  # 缺 actions: write 会让 cache-to 静默写不进去（2026-11-11 实测仓库零 buildkit 缓存条目）。
  actions: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to ECS
    runs-on: ubuntu-latest
    # 自动发布轮把「等三道 gate」搬进本 job（上限 20 分钟），加上冷缓存构建、
    # 上传与 ECS 校验可能接近 25 分钟；放宽到 30 分钟，避免被 job 级硬超时误杀，
    # 让失败原因始终落在明确的 gate 状态上。
    timeout-minutes: 30
    env:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_PORT: ${{ secrets.ECS_PORT || '22' }}
      ECS_USER: ${{ secrets.ECS_USER || 'root' }}
      ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
      ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
      RESET_DATABASE: ${{ inputs.reset_database || 'false' }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          # 发布成功后要确认部署提交仍是 main 的祖先，再写回发布记录。
          fetch-depth: 0
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ECS_HOST ECS_USER ECS_SSH_PRIVATE_KEY ECS_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker 官方 gha cache 文档：inline step 手动调用 buildx 时，cache service 变量
      # 不会自动暴露；由该 helper 写入 GITHUB_ENV，否则 cache-from/to 静默失效。
      - name: Expose GitHub Actions cache runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Build production images
        shell: bash
        run: |
          set -uo pipefail
          echo "gha cache env: cache_url=${ACTIONS_CACHE_URL:+set} results_url=${ACTIONS_RESULTS_URL:+set} runtime_token=${ACTIONS_RUNTIME_TOKEN:+set}"
          VERSION="$(tr -d '\r\n' < VERSION)"
          [[ -n "$VERSION" ]] || { echo 'Unable to read project VERSION' >&2; exit 1; }
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

          # 前后端镜像互不依赖，并行构建；后续打包、上传与 ECS 校验口径不变。
          docker buildx build --platform linux/amd64 --load \
            --cache-from type=gha,scope=heijin-backend \
            --cache-to type=gha,mode=max,scope=heijin-backend \
            -t "heijin-backend:${VERSION}" \
            -f backend/Dockerfile . &
          backend_pid=$!

          docker buildx build --platform linux/amd64 --load \
            --cache-from type=gha,scope=heijin-frontend \
            --cache-to type=gha,mode=max,scope=heijin-frontend \
            -t "heijin-frontend:${VERSION}" \
            -f frontend/Dockerfile . &
          frontend_pid=$!

          backend_status=0
          frontend_status=0
          wait "$backend_pid" || backend_status=$?
          wait "$frontend_pid" || frontend_status=$?
          if [[ "$backend_status" -ne 0 || "$frontend_status" -ne 0 ]]; then
            echo "backend build exit=${backend_status}; frontend build exit=${frontend_status}" >&2
            exit 1
          fi

      # 镜像回归门禁（构建后、打包前，早失败）：体积用 inspect 真实层去重字节（非 docker images
      # 层累加假象），amd64 实测基线 29.6MB，阈值 34MB——加速包回归(+6MB)/pyc 回流(+6MB)都会超。
      # 内容用动态 site-packages 路径（python3 -c import site，防换基础镜像后扫错目录假阴性）：
      # pyc 必须 0、uvloop/httptools/watchfiles 不得回归、strip(binutils)不进运行层。
      # 实测：干净 amd64 镜像 PASS；注入假 pyc 的阳性对照 FAIL——两向都已验证。
      - name: Verify backend image budget & content
        shell: bash
        run: |
          set -euo pipefail
          IMG="heijin-backend:${APP_VERSION}"
          SIZE_BYTES="$(docker image inspect "$IMG" --format '{{.Size}}')"
          SIZE_MB="$(awk "BEGIN{printf \"%.1f\", $SIZE_BYTES/1048576}")"
          LIMIT_BYTES=$((34 * 1048576))
          echo "backend image inspect size = ${SIZE_MB} MB (limit 34 MB)"
          if [ "$SIZE_BYTES" -gt "$LIMIT_BYTES" ]; then
            echo "::error::backend 镜像 ${SIZE_MB}MB 超过 34MB 上限；检查加速包回归 / pyc 回流 / 误加依赖" >&2
            exit 1
          fi
          docker run --rm --entrypoint sh "$IMG" -c '
            SP="$(python3 -c "import site; print(site.getsitepackages()[0])")"
            [ -d "$SP" ] || { echo "site-packages 不存在: $SP" >&2; exit 1; }
            pyc="$(find "$SP" -name "*.pyc" 2>/dev/null | wc -l | tr -d " ")"
            acc="$(find "$SP" -maxdepth 1 \( -iname "uvloop*" -o -iname "httptools*" -o -iname "watchfiles*" \) 2>/dev/null | wc -l | tr -d " ")"
            echo "site-packages=$SP pyc=$pyc accel_dirs=$acc"
            [ "$pyc" -eq 0 ] || { echo "::error::运行层残留 $pyc 个 .pyc（多阶段构建应在 pip install 同层删除）" >&2; exit 1; }
            [ "$acc" -eq 0 ] || { echo "::error::加速包回归 $acc 个（裸 uvicorn 不应含 uvloop/httptools/watchfiles）" >&2; exit 1; }
            if command -v strip >/dev/null 2>&1; then echo "::error::binutils/strip 混入运行层" >&2; exit 1; fi
            echo "镜像体积与内容门禁通过"
          '
          echo "backend image budget & content OK"

      - name: Create deployment package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          docker save "heijin-backend:${APP_VERSION}" "heijin-frontend:${APP_VERSION}" \
            | gzip > "output/heijin-images-${APP_VERSION}-amd64.tar.gz"

          # 只上传运行所需的部署文件；应用代码和静态资源已在镜像中。
          # VERSION 必须保留，deploy.sh 用它读取镜像版本。
          tar -czf output/heijin-source.tar.gz \
            VERSION \
            deploy/docker-compose.yml \
            deploy/scripts \
            frontend/nginx.conf

          tar -czf output/heijin-deploy.tgz -C output \
            "heijin-images-${APP_VERSION}-amd64.tar.gz" \
            heijin-source.tar.gz

          gzip -t "output/heijin-images-${APP_VERSION}-amd64.tar.gz"
          gzip -t output/heijin-source.tar.gz
          gzip -t output/heijin-deploy.tgz
          if tar -tzf output/heijin-source.tar.gz | grep -E '(^|/)(data/|.*\.db($|\.))'; then
            echo 'Refusing to package development database/data files' >&2
            exit 1
          fi
          echo "DEPLOY_PACKAGE_SHA256=$(shasum -a 256 output/heijin-deploy.tgz | awk '{print $1}')" >> "$GITHUB_ENV"

      # 自动发布轮由 main-ci-cd 与三道 gate 同时启动：走到这里镜像构建与打包已完成，
      # 但「上传 ECS」必须等门禁全绿。未过门禁的包只留在 runner，不落 ECS；
      # 手动补发 / 回滚（wait_for_gates=false）跳过本步，行为与改动前一致。
      - name: Wait for required CI gates
        if: ${{ inputs.wait_for_gates == true || inputs.wait_for_gates == 'true' }}
        shell: bash
        env:
          SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          started=$(date +%s)
          # 一次 API 取三道 gate 在 release sha 上的最新 run，按 path 分组后只判每组最新一条，
          # 避免「每个 wf 各查一次列表 + 各查一次详情」的 6 次/轮串行请求拖长轮询周期。
          for i in $(seq 1 240); do
            state="$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --jq '
                [.workflow_runs[]
                  | select((.path | split("/") | last) as $n
                    | ["lint-gate.yml", "frontend-gate.yml", "backend-gate.yml"]
                      | index($n) != null)]
                | group_by(.path)
                | map(sort_by(.created_at) | last)
                | if length < 3 then "pending"
                  elif any(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
                    then "failed:" + ([.[]
                      | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
                      | .path] | join(","))
                  elif all(.conclusion == "success") then "success"
                  else "pending" end
              ' 2>/dev/null || echo pending)"
            echo "[$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)] attempt=$i gates=$state"
            case "$state" in
              success) break ;;
              failed:*) echo "CI gate(s) not green: $state" >&2; exit 1 ;;
            esac
            sleep 5
          done
          [ "$state" = success ] || { echo "CI gates timed out" >&2; exit 1; }
          echo "[$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)] all CI gates passed in $(( $(date +%s) - started ))s"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ECS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$ECS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Upload deployment package
        shell: bash
        run: |
          set -euo pipefail
          # 不依赖 ECS 侧的 SFTP/SCP 子系统，直接通过 SSH 流式写入临时文件。
          # 保活与超时避免网络异常时占满整个 job；只有校验通过才替换正式包。
          SSH_OPTS=(
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          REMOTE="${ECS_USER}@${ECS_HOST}"
          timeout --signal=TERM --kill-after=30s 8m \
            ssh "${SSH_OPTS[@]}" -p "$ECS_PORT" "$REMOTE" \
            'umask 077; cat > /tmp/heijin-deploy.tgz.part && mv -f /tmp/heijin-deploy.tgz.part /tmp/heijin-deploy.tgz' \
            < output/heijin-deploy.tgz

          REMOTE_PACKAGE_SHA256="$(
            ssh "${SSH_OPTS[@]}" -p "$ECS_PORT" "$REMOTE" \
              "sha256sum /tmp/heijin-deploy.tgz | cut -d ' ' -f1"
          )"
          [[ "$REMOTE_PACKAGE_SHA256" == "$DEPLOY_PACKAGE_SHA256" ]] || {
            echo "Deployment package checksum mismatch: local=$DEPLOY_PACKAGE_SHA256 remote=$REMOTE_PACKAGE_SHA256" >&2
            exit 1
          }

      - name: Deploy and verify production
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$ECS_PORT" "${ECS_USER}@${ECS_HOST}" \
            "APP_VERSION='${APP_VERSION}' DEPLOY_PACKAGE_SHA256='${DEPLOY_PACKAGE_SHA256}' RESET_DATABASE='${RESET_DATABASE}' bash -s" <<'REMOTE'
          set -euo pipefail
          rm -rf /tmp/heijin-gh-cd
          mkdir -p /tmp/heijin-gh-cd

          echo "${DEPLOY_PACKAGE_SHA256}  /tmp/heijin-deploy.tgz" | sha256sum -c -
          gzip -t /tmp/heijin-deploy.tgz
          tar -xzf /tmp/heijin-deploy.tgz -C /tmp/heijin-gh-cd
          gzip -t "/tmp/heijin-gh-cd/heijin-images-${APP_VERSION}-amd64.tar.gz"
          gzip -t /tmp/heijin-gh-cd/heijin-source.tar.gz
          gunzip -c "/tmp/heijin-gh-cd/heijin-images-${APP_VERSION}-amd64.tar.gz" | docker load
          tar -xzf /tmp/heijin-gh-cd/heijin-source.tar.gz -C /opt/heijin

          cd /opt/heijin/deploy

          if [ "$RESET_DATABASE" = "true" ]; then
            echo "==> 重建 PostgreSQL 数据卷（仅限本次手动确认的全量置换）"
            docker compose down -v
            docker compose up -d db
            docker compose run --rm backend alembic upgrade head
          fi

          # 持久化发布版本：deploy.sh 只在本次进程内覆盖 APP_VERSION，.env 若仍写旧 tag，
          # 之后在 ECS 上单独执行 docker compose up -d 会静默回落到旧镜像（回滚事故）。
          if grep -q '^APP_VERSION=' .env; then
            sed -i "s/^APP_VERSION=.*/APP_VERSION=${APP_VERSION}/" .env
          else
            printf '\nAPP_VERSION=%s\n' "${APP_VERSION}" >> .env
          fi
          grep '^APP_VERSION=' .env

          # deploy.sh 内含发布前后的只读库状态不变量校验，任一校验失败即非零退出，
          # CI 判红，不会静默上线。B4（售出表单三作用域补齐）不在 deploy.sh 内自动执行：
          # 已有库升级须在 ECS 现场按当期执行单手动跑 backend/scripts/split_sale_form_scopes.py。
          ERP_SKIP_BUILD=1 APP_VERSION="$APP_VERSION" bash scripts/deploy.sh
          curl -fsS http://127.0.0.1/api/health
          REMOTE

      - name: Capture verified release time
        shell: bash
        run: echo "RELEASE_PUBLISHED_AT=$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%:z)" >> "$GITHUB_ENV"

      - name: Collect deployment diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          ssh -p "$ECS_PORT" "${ECS_USER}@${ECS_HOST}" \
            'cd /opt/heijin/deploy && docker compose ps && docker compose logs --no-color --tail=200 backend db frontend' \
            || true

      - name: Publish deployment summary
        run: |
          {
            echo "### Production deployment"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Version: \`${APP_VERSION}\`"
            echo "- Target: ECS"
            echo "- Health check: passed"
            echo "- DB invariants: verified (deploy.sh)"
            echo "- Sale form scopes: B4 is a manual ECS step (not auto backfilled)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tag release
        # 部署成功后打 annotated git tag（v<version>），作为线上运行版本的不可变快照，
        # 便于出问题回溯"线上跑的是哪次提交"，也供 rollback.yml 输入版本号。
        if: success()
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          TAG="v${APP_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Remote tag ${TAG} already exists, skipping"
          else
            git tag -a "${TAG}" -m "Production release ${APP_VERSION} (${GITHUB_SHA})"
            git push origin "${TAG}"
          fi

      - name: Record confirmed publication
        # 自动发布才更新新系列记录；手动部署可能是回滚，不自动改写原发布时间。
        if: ${{ success() && (inputs.wait_for_gates == true || inputs.wait_for_gates == 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          deployed_sha="$(git rev-parse HEAD)"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          for attempt in 1 2 3; do
            git fetch origin main
            git switch --force-create release-record FETCH_HEAD
            if ! git merge-base --is-ancestor "$deployed_sha" HEAD; then
              echo "::error::生产部署已成功，但部署提交不在当前 main 历史中，未修改发布记录" >&2
              exit 1
            fi
            python3 scripts/ops/record_release_published.py "$APP_VERSION" --at "$RELEASE_PUBLISHED_AT"
            if git diff --quiet -- docs/版本管理.md; then
              echo "发布记录已有发布时间，无需重复提交"
              exit 0
            fi
            git add docs/版本管理.md
            git commit -m "chore(release): 记录 V${APP_VERSION} 发布时间"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "发布记录推送遇到并发更新，重试 ${attempt}/3" >&2
          done
          echo "::error::生产部署已成功，但发布记录推送失败；请根据本次部署日志补记" >&2
          exit 1
