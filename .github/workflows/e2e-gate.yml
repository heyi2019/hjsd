name: e2e-gate

# E2E 门禁：真实 Chromium + 真实后端 + 独立 PG 库 heijin_erp_e2e。
# 复用常驻 e2e 库（不再每次重建）：e2e_db.py 按 (business_mode, inventory_type) 补足
# IN_STOCK 账号，用例消耗后在库账号下一轮自动补齐；库容器常驻、绝不触碰 dev/test/release。
# main / test 推送、PR、手动触发均阻塞。

on:
  push:
    branches: [main, master, test]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  E2E_DATABASE_URL: "postgresql+psycopg://erp_app:erp_app@postgres:5432/heijin_erp_e2e"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_app
          POSTGRES_PASSWORD: erp_app
          POSTGRES_DB: heijin_erp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies (venv)
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Install frontend dependencies (仓库根 npm workspaces)
        working-directory: .
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E (真实浏览器 + 真实后端 + 独立 E2E 库)
        working-directory: frontend
        run: npm run test:e2e

      # E2E 结果翻译进《测试结果库/results.jsonl》，否则报告 E2E 行恒为 0。
      # 用 always()：E2E 失败时更要把 FAIL 记进去，那正是报告要暴露的东西。
      - name: Record E2E results → 测试结果库
        if: always()
        working-directory: backend
        run: .venv/bin/python scripts/record_e2e_results.py --json test-results/playwright-report.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
