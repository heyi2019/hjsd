name: frontend-gate

# 前端门禁三档（2026-11-11 裁决，替代「每次 push 都跑全量」）：
#   ① full_suite=true → 前端全量含 deep + 真实后端浏览器联动
#   ② 本次提交有前端/测试变更 → npm run test:changed，按变更区域选测；公共层/分层配置运行完整前端测试
#   ③ 无前端/测试变更 → npm run test:quick 冒烟，不静默跳过
#   E2E 规格及关键源码变更运行受影响规格；E2E 共享配置变更或全量档运行完整浏览器测试。
# 变更路径由 workflow 计算并经 TEST_CHANGED_PATHS 注入：CI checkout 后 git status 恒为空，
# 不能靠脚本自己读工作区，必须显式喂「本次 commit diff」。
# 正式发布由 main-ci-cd 在 release sha 上调用，并传入原始 push 范围；
# 日常推送不自动运行，必要时可手动指定范围触发。
on:
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Run the full CI suite instead of changed-area tests"
        required: false
        type: boolean
        default: false
      changed_paths:
        description: "Comma-separated changed paths from the original push (set by main-ci-cd)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      release_sha:
        required: true
        type: string
      full_suite:
        required: false
        type: boolean
        default: false
      changed_paths:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      e2e_mode: ${{ steps.scope.outputs.e2e_mode }}
      e2e_paths: ${{ steps.scope.outputs.e2e_paths }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Verify release commit
        if: ${{ inputs.release_sha }}
        working-directory: .
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Verify release workflow safety
        run: npm run test:fast -- --maxWorkers=4 tests/frontend/unit/system/release-workflow.test.ts

      - name: Resolve changed paths
        id: scope
        working-directory: .
        shell: bash
        env:
          CI_CHANGED_PATHS: ${{ inputs.changed_paths || '' }}
          CI_FULL_SUITE: ${{ inputs.full_suite || 'false' }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          scope="$(python3 scripts/ops/ci_test_scope.py)"
          printf '%s\n' "$scope"
          paths="$(printf '%s\n' "$scope" | sed -n 's/^changed_paths=//p')"
          full="$(printf '%s\n' "$scope" | sed -n 's/^full_suite=//p')"
          E2E_CHANGED_PATHS="$paths" E2E_FULL_SUITE="$full" python3 scripts/ops/e2e_test_scope.py >> "$GITHUB_OUTPUT"
          printf 'TEST_CHANGED_PATHS=%s\n' "$paths" >> "$GITHUB_ENV"
          printf 'TEST_FULL_SUITE=%s\n' "$full" >> "$GITHUB_ENV"

      - name: Check and test frontend
        run: |
          set -euo pipefail
          npm run check
          if [[ "${TEST_FULL_SUITE:-true}" == "true" ]]; then
            echo "全量 CI 档（full_suite=true）"
            npm run test:ci
          else
            npm run test:changed -- --ci
          fi

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Verify release commit
        if: ${{ inputs.release_sha }}
        working-directory: .
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Build frontend
        run: npm run build

  browser-e2e:
    name: Browser tests with isolated backend
    needs: [frontend-tests]
    if: ${{ (inputs.full_suite || needs.frontend-tests.outputs.e2e_mode != 'none') && (github.event_name == 'workflow_dispatch' || inputs.release_sha) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_e2e
          POSTGRES_PASSWORD: erp_e2e
          POSTGRES_DB: heijin_erp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_e2e -d heijin_erp_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      APP_ENV: development
      E2E_DATABASE_URL: postgresql+psycopg://erp_e2e:erp_e2e@127.0.0.1:5432/heijin_erp_e2e
      CUSTOMER_RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Verify release commit
        if: ${{ inputs.release_sha }}
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.lock.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser integration tests
        working-directory: frontend
        env:
          E2E_MODE: ${{ needs.frontend-tests.outputs.e2e_mode }}
          E2E_PATHS: ${{ needs.frontend-tests.outputs.e2e_paths }}
        run: |
          set -euo pipefail
          if [[ "$E2E_MODE" == "all" ]]; then
            npm run test:e2e -- --workers=1
          elif [[ "$E2E_MODE" == "selected" && -n "$E2E_PATHS" ]]; then
            IFS=, read -r -a specs <<< "$E2E_PATHS"
            npm run test:e2e -- --workers=1 "${specs[@]}"
          else
            echo "无可执行的 E2E 选测范围" >&2
            exit 1
          fi

      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-results
          path: frontend/test-results/
          if-no-files-found: ignore
