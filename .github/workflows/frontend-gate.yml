name: frontend-gate

# 前端门禁三档（2026-11-11 裁决，替代「每次 push 都跑全量」）：
#   ① full_suite=true（手动 workflow_dispatch）→ npm run test:ci，全量含 deep，发版收口/里程碑用
#   ② 本次提交有前端/测试变更 → npm run test:changed，按变更区域选测；命中公共层/分层配置自动降级 quick
#   ③ 无前端/测试变更 → npm run test:quick 冒烟，不静默跳过
# 变更路径由 workflow 计算并经 TEST_CHANGED_PATHS 注入：CI checkout 后 git status 恒为空，
# 不能靠脚本自己读工作区，必须显式喂「本次 commit diff」。
# main/master 的 push 不跑本门禁：由 main-ci-cd 在 release sha 上统一 dispatch 一轮，
# 并由它把「原始 push 范围」的变更路径集经 changed_paths 传入，天然不含自动发版改的版本文件。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Run the full CI suite instead of changed-area tests"
        required: false
        type: boolean
        default: false
      changed_paths:
        description: "Comma-separated changed paths from the original push (set by main-ci-cd)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend checks and tests
    # main/master 的 push 由 main-ci-cd 在 release sha 上统一 dispatch 门禁；
    # 这里再跑一遍只是重复计算。PR 与手动 dispatch 仍照常执行。
    if: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Resolve changed paths
        working-directory: .
        shell: bash
        env:
          INJECTED_PATHS: ${{ inputs.changed_paths || '' }}
        run: |
          set -euo pipefail
          if [[ -n "${INJECTED_PATHS:-}" ]]; then
            # main-ci-cd 在 release dispatch 时算好「原始 push 范围」原样传入：不含自动
            # 发版产生的版本文件，避免把升版改动混进变更集导致选测误降级。
            paths="$INJECTED_PATHS"
            echo "source=main-ci-cd"
          else
            base="${{ github.event.before || '' }}"
            pr_base="${{ github.event.pull_request.base.sha || '' }}"
            if [[ -n "$pr_base" ]]; then
              base="$pr_base"
            elif [[ -z "$base" || "$base" =~ ^0{40}$ ]]; then
              base="HEAD^"
            fi
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="HEAD^"
            fi
            paths="$(git diff --name-only "$base" "${{ github.sha }}" | paste -sd, -)"
            echo "source=local git diff base=$base"
          fi
          printf 'TEST_CHANGED_PATHS=%s\n' "$paths" >> "$GITHUB_ENV"
          fe="$(printf '%s' "$paths" | tr ',' '\n' | grep -cE '^(frontend/|tests/)' || true)"
          echo "frontend_related=$fe paths=${paths:-<none>}"

      - name: Check and test frontend
        env:
          FULL_SUITE: ${{ inputs.full_suite || 'false' }}
        run: |
          set -euo pipefail
          npm run check
          if [[ "$FULL_SUITE" == "true" ]]; then
            echo "全量 CI 档（full_suite=true）"
            npm run test:ci
          elif [[ -n "${TEST_CHANGED_PATHS:-}" ]] \
            && printf '%s' "$TEST_CHANGED_PATHS" | tr ',' '\n' | grep -qE '^(frontend/|tests/)'; then
            echo "按变更选测：${TEST_CHANGED_PATHS}"
            npm run test:changed
          else
            echo "无前端/测试变更，跑 quick 冒烟档"
            npm run test:quick
          fi

  frontend-build:
    name: Frontend build
    # main/master 的 push 由 main-ci-cd 在 release sha 上统一 dispatch 门禁；
    # 这里再跑一遍只是重复计算。PR 与手动 dispatch 仍照常执行。
    if: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Build frontend
        run: npm run build
