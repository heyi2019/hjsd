name: frontend-gate

# 前端门禁三档（2026-11-11 裁决，替代「每次 push 都跑全量」）：
#   ① full_suite=true → 前端全量含 deep + 真实后端浏览器联动
#   ② 本次提交有前端/测试变更 → npm run test:changed，按变更区域选测；命中公共层/分层配置自动降级 quick
#   ③ 无前端/测试变更 → npm run test:quick 冒烟，不静默跳过
# 变更路径由 workflow 计算并经 TEST_CHANGED_PATHS 注入：CI checkout 后 git status 恒为空，
# 不能靠脚本自己读工作区，必须显式喂「本次 commit diff」。
# main/master 的 push 不重复跑：由 main-ci-cd 在 release sha 上统一调用一轮，
# 并由它把「原始 push 范围」的变更路径集经 changed_paths 传入，天然不含自动发版改的版本文件。
on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Run the full CI suite instead of changed-area tests"
        required: false
        type: boolean
        default: false
      changed_paths:
        description: "Comma-separated changed paths from the original push (set by main-ci-cd)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      release_sha:
        required: true
        type: string
      full_suite:
        required: false
        type: boolean
        default: false
      changed_paths:
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend checks and tests
    if: ${{ inputs.release_sha || github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Verify release commit
        if: ${{ inputs.release_sha }}
        working-directory: .
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Verify release workflow safety
        run: npm run test:fast -- --maxWorkers=4 tests/frontend/unit/system/release-workflow.test.ts

      - name: Resolve changed paths
        working-directory: .
        shell: bash
        env:
          CI_CHANGED_PATHS: ${{ inputs.changed_paths || '' }}
          CI_FULL_SUITE: ${{ inputs.full_suite || 'false' }}
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          scope="$(python3 scripts/ops/ci_test_scope.py)"
          printf '%s\n' "$scope"
          paths="$(printf '%s\n' "$scope" | sed -n 's/^changed_paths=//p')"
          full="$(printf '%s\n' "$scope" | sed -n 's/^full_suite=//p')"
          printf 'TEST_CHANGED_PATHS=%s\n' "$paths" >> "$GITHUB_ENV"
          printf 'TEST_FULL_SUITE=%s\n' "$full" >> "$GITHUB_ENV"
          fe="$(printf '%s' "$paths" | tr ',' '\n' | grep -cE '^(frontend/|tests/)' || true)"
          echo "frontend_related=$fe paths=${paths:-<none>}"

      - name: Check and test frontend
        run: |
          set -euo pipefail
          npm run check
          if [[ "${TEST_FULL_SUITE:-true}" == "true" ]]; then
            echo "全量 CI 档（full_suite=true）"
            npm run test:ci
          elif [[ -n "${TEST_CHANGED_PATHS:-}" ]] \
            && printf '%s' "$TEST_CHANGED_PATHS" | tr ',' '\n' | grep -qE '^(frontend/|tests/)'; then
            echo "按变更选测：${TEST_CHANGED_PATHS}"
            npm run test:changed
          else
            echo "无前端/测试变更，跑 quick 冒烟档"
            npm run test:quick
          fi

  frontend-build:
    name: Frontend build
    if: ${{ inputs.release_sha || github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Verify release commit
        if: ${{ inputs.release_sha }}
        working-directory: .
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Build frontend
        run: npm run build

  browser-e2e:
    name: Browser tests with isolated backend
    if: ${{ inputs.full_suite && (github.event_name == 'workflow_dispatch' || inputs.release_sha) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_e2e
          POSTGRES_PASSWORD: erp_e2e
          POSTGRES_DB: heijin_erp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_e2e -d heijin_erp_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      APP_ENV: development
      E2E_DATABASE_URL: postgresql+psycopg://erp_e2e:erp_e2e@127.0.0.1:5432/heijin_erp_e2e
      CUSTOMER_RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Verify release commit
        if: ${{ inputs.release_sha }}
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.lock.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser integration tests
        working-directory: frontend
        run: npm run test:e2e -- --workers=1

      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-results
          path: frontend/test-results/
          if-no-files-found: ignore
