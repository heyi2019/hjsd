name: lint-gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # 与后端门禁保持一致：python:3.12
    # main/master 的 push 由 main-ci-cd 在 release sha 上统一 dispatch 门禁；
    # 这里再跑一遍只是重复计算。PR 与手动 dispatch 仍照常执行。
    if: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyflakes (pinned to match local baseline)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # 钉 4.0.3 确保 CI 与本地基线(lint_baseline.txt)生成版本一致，避免漂移误红
          pip install pyflakes==4.0.3

      - name: Run lint gate
        # 阈值法：复用 dev 的 run_regression.py lint，与 lint_baseline.txt 单一事实源对齐。
        # 仅当 pyflakes 出现「基线外的新增告警」才判红；存量告警按基线放行，只拦净增。
        # 存量数字随清理收紧，此处不写死条数（避免文档漂移），以 lint_baseline.txt 为准。
        working-directory: backend
        run: python run_regression.py lint

      - name: Install import-linter (pinned to match requirements-dev.txt)
        working-directory: backend
        run: pip install import-linter==2.16

      - name: Run import contract gate
        # 域依赖方向门禁（backend/.importlinter）4 条契约：core 不得依赖 domain、
        # shared 不得依赖任何业务域、orders 不得依赖 finance（含 installments /
        # profit_allocation 子模块）、stocks 不得依赖 orders。
        # 四层模型 0 豁免，新增违规 import 即红。
        working-directory: backend
        run: lint-imports

      - name: Run shared layer gate
        # shared 防膨胀：新模块须在 scripts/check_shared_layer.py 的 REGISTRY 登记
        # 归位理由，且被 ≥2 业务域直接或传递引用，防止 shared 退化成垃圾桶层。
        working-directory: backend
        run: python scripts/check_shared_layer.py
