name: main-ci-cd

# 本地 main 直接推送云端 main：三项 CI 全绿后才触发生产发布。
on:
  push:
    branches: [main]

concurrency:
  group: main-ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  wait-and-deploy:
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for required CI gates
        run: |
          set -euo pipefail
          for wf in lint-gate.yml frontend-gate.yml backend-gate.yml; do
            echo "waiting for $wf ..."
            for i in $(seq 1 80); do
              run_id=$(gh run list --workflow "$wf" --limit 20 --json databaseId,headSha \
                --jq "[.[] | select(.headSha == \"$SHA\")] | .[0].databaseId // empty" 2>/dev/null || true)
              status=""
              if [ -n "$run_id" ]; then
                status=$(gh run view "$run_id" --json status,conclusion \
                  --jq '.conclusion // .status' 2>/dev/null || true)
              fi
              echo "  attempt=$i run_id=${run_id:-none} status=${status:-unknown}"
              if [ "$status" = success ]; then break; fi
              if [ "$status" = failure ] || [ "$status" = cancelled ] || [ "$status" = timed_out ]; then
                echo "$wf: $status" >&2
                exit 1
              fi
              sleep 15
            done
            [ "$status" = success ] || { echo "$wf timed out" >&2; exit 1; }
          done

      - name: Trigger production deploy
        run: gh workflow run deploy-production.yml --ref "$SHA"
