name: main-ci-cd

# 本地 main 直接推送云端 main：自动分级升版、生成变更摘要，三项 CI 全绿后发布。
on:
  push:
    branches: [main]

concurrency:
  # 自动发版推回的 chore(release) 提交会再次触发本工作流；不能让它取消
  # 正在进行中的发版轮次（否则 wait-and-deploy 被掐断，生产会漏部署）。
  group: main-ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  prepare-release:
    name: Prepare automatic release
    # chore(release) 是自动发版自己推回 main 的提交：整轮跳过，
    # 避免重复升版、重复 dispatch 门禁、重复触发生产部署。
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and summarize changes
        id: release
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_started=$(date +%s)
          echo "[$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)] automatic release preparation started"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          current_subject="$(git log -1 --format=%s)"
          if [[ "$current_subject" == chore\(release\):* ]]; then
            version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/app/version.py | head -1)"
            echo "本提交已完成自动发版，跳过重复升号：V${version}"
          else
            summary_file="${RUNNER_TEMP}/release-summary.md"
            scripts/ops/auto_release.sh "$BASE_SHA" "$HEAD_SHA" | tee "$summary_file"
            {
              echo "## Automatic release"
              cat "$summary_file"
            } >> "$GITHUB_STEP_SUMMARY"
            git add backend/app/version.py frontend/package.json package-lock.json RELEASE.md
            version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/app/version.py | head -1)"
            git commit -m "chore(release): v${version}"
            git push origin HEAD:main
          fi
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/app/version.py | head -1)"
          release_sha="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          release_duration=$(( $(date +%s) - release_started ))
          echo "[$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)] automatic release preparation finished in ${release_duration}s"
          echo "- 自动发版准备耗时：${release_duration}s" >> "$GITHUB_STEP_SUMMARY"
          # 三道 gate 的 push 触发已跳过 main/master：只保留本轮（release sha）门禁，
          # 避免同一批代码被校验两遍；wait-and-deploy 等待的正是本轮 run。
          for wf in lint-gate.yml backend-gate.yml; do
            gh api --method POST "repos/$REPO/actions/workflows/$wf/dispatches" -f ref=main
          done
          # 前端按变更选测：由这里算「原始 push 范围」的变更路径并原样传给 dispatch 轮。
          # 不能只传 BASE_SHA 让 gate 自己 diff：release 提交必然改 frontend/package.json，
          # 该路径属选测脚本的 STRUCTURAL，会把任何业务区域选测一并降级成 quick 冒烟。
          diff_base="$BASE_SHA"
          if [[ -z "$diff_base" || "$diff_base" =~ ^0{40}$ ]] \
            || ! git cat-file -e "${diff_base}^{commit}" 2>/dev/null; then
            diff_base="${HEAD_SHA}^"
          fi
          changed_paths="$(git diff --name-only "$diff_base" "$HEAD_SHA" | paste -sd, -)"
          echo "release dispatch changed_paths_chars=${#changed_paths} value=${changed_paths:-<none>}"
          jq -n --arg ref main --arg paths "$changed_paths" \
            '{ref:$ref, inputs:{changed_paths:$paths}}' \
            | gh api --method POST "repos/$REPO/actions/workflows/frontend-gate.yml/dispatches" --input -

  wait-and-deploy:
    needs: prepare-release
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.prepare-release.outputs.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for required CI gates
        run: |
          set -euo pipefail
          workflow_started=$(date +%s)
          for wf in lint-gate.yml frontend-gate.yml backend-gate.yml; do
            gate_started=$(date +%s)
            echo "[$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)] waiting for $wf ..."
            # 5s 轮询 / 240 次上限：总等待上限仍是 20 分钟，尾部空转从最多 15s 降到 5s。
            for i in $(seq 1 240); do
              run_id=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
                --jq "[.workflow_runs[] | select(.path == \".github/workflows/$wf\")] | sort_by(.created_at) | last | .id // empty" \
                2>/dev/null || true)
              status=""
              if [ -n "$run_id" ]; then
                status=$(gh api "repos/$REPO/actions/runs/$run_id" \
                  --jq '.conclusion // .status' 2>/dev/null || true)
              fi
              echo "[$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)] attempt=$i run_id=${run_id:-none} status=${status:-unknown}"
              if [ "$status" = success ]; then break; fi
              if [ "$status" = failure ] || [ "$status" = cancelled ] || [ "$status" = timed_out ]; then
                echo "$wf: $status" >&2
                exit 1
              fi
              sleep 5
            done
            [ "$status" = success ] || { echo "$wf timed out" >&2; exit 1; }
            echo "[$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)] $wf passed in $(( $(date +%s) - gate_started ))s"
          done
          echo "[$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)] all CI gates passed in $(( $(date +%s) - workflow_started ))s"

      - name: Trigger production deploy
        run: |
          started=$(date +%s)
          echo "[$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)] dispatch deploy-production ref=$SHA"
          gh api --method POST "repos/$REPO/actions/workflows/deploy-production.yml/dispatches" \
            --input - <<EOF
          {"ref":"main","inputs":{"release_sha":"$SHA"}}
          EOF
          echo "[$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)] deploy-production dispatched in $(( $(date +%s) - started ))s"
