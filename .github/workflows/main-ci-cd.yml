name: main-ci-cd

# GitHub 发布合并到 origin/main 后触发。三项门禁通过后构建并部署。
on:
  push:
    branches: [main]

concurrency:
  # 自动发版推回的 chore(release) 提交会再次触发本工作流；不能让它取消
  # 正在进行中的发版轮次，避免生产漏部署。
  group: main-ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  prepare-release:
    name: Prepare automatic release
    # chore(release) 是自动发版自己推回 main 的提交：整轮跳过，
    # 避免重复升版、重复 dispatch 门禁、重复触发生产部署。
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      reset_database: ${{ steps.release.outputs.reset_database }}
      full_suite: ${{ steps.release.outputs.full_suite }}
      changed_paths: ${{ steps.release.outputs.changed_paths }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and summarize changes
        id: release
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_started=$(date +%s)
          echo "[$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)] automatic release preparation started"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          current_subject="$(git log -1 --format=%s)"
          reset_database="false"
          if [[ "$current_subject" == chore\(release\):* ]]; then
            version="$(tr -d '\r\n' < VERSION)"
            echo "本提交已完成自动发版，跳过重复升号：V${version}"
          else
            summary_file="${RUNNER_TEMP}/release-summary.md"
            scripts/ops/auto_release.sh "$BASE_SHA" "$HEAD_SHA" | tee "$summary_file"
            {
              echo "## Automatic release"
              cat "$summary_file"
            } >> "$GITHUB_STEP_SUMMARY"
            version="$(tr -d '\r\n' < VERSION)"
            reset_database="$(python3 scripts/ops/release_reset_requested.py "$BASE_SHA" "$HEAD_SHA" "$version")"
            git add VERSION docs/版本管理.md
            git commit -m "chore(release): v${version}"
            git push origin HEAD:main
          fi
          version="$(tr -d '\r\n' < VERSION)"
          release_sha="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "reset_database=$reset_database" >> "$GITHUB_OUTPUT"
          CI_EVENT_NAME=push CI_FULL_SUITE="$reset_database" CI_CHANGED_PATHS='' \
            CI_BASE_SHA="$BASE_SHA" CI_HEAD_SHA="$HEAD_SHA" \
            python3 scripts/ops/ci_test_scope.py >> "$GITHUB_OUTPUT"
          release_duration=$(( $(date +%s) - release_started ))
          echo "[$(TZ=Asia/Shanghai date +%Y-%m-%dT%H:%M:%S%z)] automatic release preparation finished in ${release_duration}s"
          echo "- 自动发版准备耗时：${release_duration}s" >> "$GITHUB_STEP_SUMMARY"

  lint:
    needs: [prepare-release]
    uses: ./.github/workflows/lint-gate.yml
    permissions:
      contents: read
    with:
      release_sha: ${{ needs.prepare-release.outputs.sha }}

  frontend:
    needs: [prepare-release]
    uses: ./.github/workflows/frontend-gate.yml
    permissions:
      contents: read
    with:
      release_sha: ${{ needs.prepare-release.outputs.sha }}
      changed_paths: ${{ needs.prepare-release.outputs.changed_paths }}
      full_suite: ${{ fromJSON(needs.prepare-release.outputs.full_suite) }}

  backend:
    needs: [prepare-release]
    uses: ./.github/workflows/backend-gate.yml
    permissions:
      contents: read
    with:
      release_sha: ${{ needs.prepare-release.outputs.sha }}
      changed_paths: ${{ needs.prepare-release.outputs.changed_paths }}
      full_suite: ${{ fromJSON(needs.prepare-release.outputs.full_suite) }}

  full-release-report:
    name: Record full release test report
    needs: [prepare-release, lint, frontend, backend]
    if: ${{ always() && needs.prepare-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate full release report
        if: ${{ needs.prepare-release.outputs.full_suite == 'true' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.sha }}
          LINT_RESULT: ${{ needs.lint.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/release-test-report.md"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            printf '# 发布前全量测试报告\n\n'
            printf -- '- ERP 版本：%s\n' "$RELEASE_VERSION"
            printf -- '- 候选提交：%s\n' "$RELEASE_SHA"
            printf -- '- 测试范围：前端完整测试与构建、浏览器 E2E、后端完整回归及静态门禁\n'
            printf -- '- 工作流：%s（第 %s 次运行尝试）\n\n' "$run_url" "$GITHUB_RUN_ATTEMPT"
            printf '| 门禁 | 结果 |\n|---|---|\n'
            printf '| lint | %s |\n| frontend（含浏览器 E2E） | %s |\n| backend | %s |\n' "$LINT_RESULT" "$FRONTEND_RESULT" "$BACKEND_RESULT"
            printf '\n结果为各门禁任务状态；失败、取消或跳过时，范围内的测试不一定全部执行。详细测试结果见本次工作流日志及各门禁产物。\n'
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full release report
        if: ${{ needs.prepare-release.outputs.full_suite == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: full-release-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-test-report.md
          if-no-files-found: error

  deploy:
    needs: [prepare-release, lint, frontend, backend, full-release-report]
    uses: ./.github/workflows/deploy-production.yml
    with:
      release_sha: ${{ needs.prepare-release.outputs.sha }}
      reset_database: ${{ fromJSON(needs.prepare-release.outputs.reset_database) }}
      wait_for_gates: true
      gates_verified: true
    secrets: inherit
