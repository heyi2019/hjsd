# 黑金时代 ERP（宜游轩ERP）本机数据库容器。
#
# 存在理由：此前三个库（dev / test / release，合计 35 MB）寄生在另一个项目的共享容器
# `container-db-1` 里——那个容器跑着对方 841 MB 的业务库，`docker compose down -v`
# 连卷带库删掉会顺手删掉我们的上线母本；我们的归档配置也只能写进对方卷里的
# postgresql.auto.conf。库小、耦合重，所以自建。
#
# 用法（不要直接 docker compose up，密码等变量在仓库根 .env 里）：
#   bash deploy/scripts/pg_container.sh up|down|status|logs
#
# 端口只绑 127.0.0.1，不向局域网暴露。
# 本地不启用 WAL 时间点恢复；dev 和本地 main 使用每日逻辑备份。

name: heijin

services:
  db:
    image: postgres:16-alpine
    container_name: ${ERP_PG_CONTAINER:-heijin-db-1}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${ERP_PG_USER:?需要在 .env 配置 ERP_PG_USER}
      POSTGRES_PASSWORD: ${ERP_PG_PASSWORD:?需要在 .env 配置 ERP_PG_PASSWORD}
    # 只绑本机回环：三个库都只给本机后端与 pytest 用，没有跨机访问需求。
    ports:
      - "127.0.0.1:${ERP_PG_PORT:-5433}:5432"
    volumes:
      - heijin_pg_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - archive_mode=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  heijin_pg_data:
