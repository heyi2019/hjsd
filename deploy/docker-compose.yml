# 宜游轩 ERP 生产编排
# 用法（在 deploy/ 目录）：
#   cp env/.env.production.example .env   # 填入 JWT_SECRET_KEY 等生产配置
#   docker compose build
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heijin_erp}
      POSTGRES_USER: ${POSTGRES_USER:-erp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    # 镜像 tag 取 deploy.sh 从 backend/app/version.py 解析出的版本；本地直接 compose up 时回落 latest。
    image: heijin-backend:${APP_VERSION:-latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - .env            # 生产环境变量（含 JWT_SECRET_KEY / DATABASE_URL / CORS_ORIGINS）
    environment:
      # 让 /health 与镜像 tag 显示同一发布版本；shell APP_VERSION 覆盖 .env 遗留值。
      APP_VERSION: ${APP_VERSION:-latest}
    volumes:
      - erp_db:/app/data   # 保留原 SQLite 备份与附件；正式业务库已切到 PostgreSQL
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8123"
    restart: unless-stopped
    healthcheck:
      # 必须用 python3：alpine 基础镜像不提供 `python` 软链（slim 镜像才有）。
      # 写成 python 会让 healthcheck 恒失败，frontend 的 depends_on service_healthy 永不满足。
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8123/api/v1/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: heijin-frontend:${APP_VERSION:-latest}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 站点配置以仓库里的 frontend/nginx.conf 为准，运行时挂载覆盖镜像内副本。
      # 这样改配置（如启用 HTTPS）只需 rsync + 重启容器，不必重建镜像。
      - ../frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 自签证书（server.crt / server.key），由 scripts/gen_selfsigned.sh 生成。
      # 只读挂载：私钥不进镜像层，换证书只需重启前端容器。
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  erp_db:
  erp_pgdata:
