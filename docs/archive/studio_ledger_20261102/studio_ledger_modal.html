<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工作室收支登记 · Liquid Glass</title>
<style>
  :root {
    /* —— 弹簧曲线（Apple sheet 档 ζ=0.8 / response=0.3s，窗口 0.5s，预采样）
       关键帧只描述行程，过冲由该缓动承担，避免双重弹跳 —— */
    --ease-spring: linear(0, 0.0383, 0.1301, 0.2486, 0.3752, 0.4978, 0.6093, 0.706, 0.7867,
      0.8518, 0.9025, 0.9409, 0.9688, 0.9883, 1.0012, 1.0091, 1.0133, 1.015, 1.015, 1.0139,
      1.0123, 1.0104, 1.0085, 1.0067, 1.0051, 1.0038, 1.0027, 1.0018, 1.0011, 1.0007, 1.0003, 1.0001, 1);

    --glass-bg: rgba(255, 255, 255, 0.6);    /* clear 玻璃，内容透出 */
    --glass-stroke: rgba(255, 255, 255, 0.65);
    --glass-hi: rgba(255, 255, 255, 0.9);    /* 1px 内高光，近似镜面 */
    --ink: #1b2430;
    --ink-soft: #586173;
    --ink-faint: #6b7484;
    --line: rgba(20, 30, 50, 0.08);
    --brand: #0a63d8;        /* ERP 主题色（浅色档） */
    --brand-info: #0a84ff;   /* ERP info 蓝 */
    --ring: rgba(10, 99, 216, 0.22);  /* 聚焦光环：跟随 ERP 主题蓝 */
    --danger: #e8590c;
    --radius: 26px;
    --radius-sm: 14px;
    /* 18–22 岁用户以手机为主：控件的可视/触控高度统一到 50px */
    --tap: 50px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: var(--font);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: 32px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    /* ERP 品牌蓝底图：让玻璃透出主题色与明暗（regular 自适应观感近似） */
    background:
      radial-gradient(55vw 55vw at 15% 10%, rgba(10, 132, 255, 0.55) 0%, transparent 55%),
      radial-gradient(50vw 50vw at 85% 22%, rgba(10, 99, 216, 0.5) 0%, transparent 52%),
      radial-gradient(60vw 60vw at 80% 95%, rgba(47, 128, 255, 0.42) 0%, transparent 58%),
      radial-gradient(45vw 45vw at 10% 90%, rgba(90, 160, 255, 0.32) 0%, transparent 55%),
      linear-gradient(135deg, #0b1f3a, #06101f);
  }

  /* 背景虚化 + 暗化层（clear 玻璃必备的 dimming，保证文字可读） */
  .scrim {
    position: fixed; inset: 0; z-index: 0;
    background: rgba(10, 14, 24, 0.28);
    backdrop-filter: blur(6px) saturate(120%);
    -webkit-backdrop-filter: blur(6px) saturate(120%);
    animation: scrimIn .4s ease both;
  }
  @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    position: relative; z-index: 1;
    width: 470px; max-width: 100%;
    /* —— Liquid Glass 多层近似：模糊 + 饱和 + 透出底色 —— */
    background: var(--glass-bg);
    backdrop-filter: blur(38px) saturate(190%);
    -webkit-backdrop-filter: blur(38px) saturate(190%);
    border: 1px solid var(--glass-stroke);
    border-radius: var(--radius);
    /* 内高光 + 厚度阴影 + 投影，模拟玻璃层 */
    box-shadow:
      inset 0 1px 0 var(--glass-hi),
      inset 0 0 0 0.5px rgba(255, 255, 255, 0.25),
      0 30px 70px -24px rgba(8, 12, 24, 0.55),
      0 10px 28px -14px rgba(8, 12, 24, 0.4);
    overflow: hidden;
    animation: modalIn .5s var(--ease-spring) both;
  }
  /* 顶部镜面高光（静态近似）：模拟光从上方落到玻璃面 */
  .modal::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0) 30%);
  }
  .modal > * { position: relative; z-index: 1; }

  /* 关键帧只描述行程，过冲交给弹簧缓动 */
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(16px) scale(0.965); }
    to   { opacity: 1; transform: none; }
  }

  .modal__head {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 22px 4px;
  }
  .modal__icon {
    width: 40px; height: 40px; border-radius: 12px; flex: none;
    display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, var(--brand-info), var(--brand));
    box-shadow: 0 6px 16px -4px rgba(10, 99, 216, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  .modal__icon svg { width: 21px; height: 21px; }
  .modal__titles { flex: 1; min-width: 0; }
  .modal__title {
    font-size: 19px; font-weight: 650; letter-spacing: 0.1px;
    color: #141a26;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
  }
  .modal__sub { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
  .modal__close {
    width: 34px; height: 34px; border-radius: 11px; flex: none;
    border: 1px solid rgba(255, 255, 255, 0.6);
    background: rgba(255, 255, 255, 0.45);
    color: #2a3340; cursor: pointer; display: grid; place-items: center;
    transition: background .18s, transform .18s;
  }
  .modal__close:hover { background: rgba(255, 255, 255, 0.72); transform: scale(1.06); }
  .modal__close:active { transform: scale(0.94); }

  .modal__body { padding: 2px 22px 0; }

  /* 左标签 / 右填写 */
  .field {
    display: flex; align-items: center; gap: 14px;
    padding: 5px 0;
  }
  .field__label {
    flex: none; width: 60px; text-align: right;
    font-size: 13.5px; font-weight: 500; color: #5b667a;
    letter-spacing: .2px; line-height: 1.3;
    display: flex; align-items: center; justify-content: flex-end; gap: 2px;
    transition: color .18s;
  }
  /* 聚焦行时标签跟随主题色，强化「标签—控件」的关联 */
  .field:focus-within .field__label { color: var(--brand); }
  .field:focus-within .req { color: var(--danger); }
  .req { color: var(--danger); font-size: 13px; line-height: 1; }
  .field__control { flex: 1; min-width: 0; }

  /* 控件统一玻璃质感 */
  .control {
    width: 100%; height: var(--tap);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.55);
    color: var(--ink);
    padding: 0 15px; font-size: 15px; font-family: var(--font);
    outline: none; caret-color: var(--brand);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    transition: background .18s, border-color .18s, box-shadow .18s, transform .18s;
  }
  .control::placeholder { color: var(--ink-faint); }
  .control:focus {
    background: rgba(255, 255, 255, 0.85);
    border-color: var(--brand);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 0 0 4px var(--ring);
    transform: translateY(-1px); /* 聚焦轻抬，呼应 lift into glass */
  }
  textarea.control { height: auto; min-height: 82px; padding: 12px 15px; resize: vertical; line-height: 1.6; }
  .control--hint { color: var(--ink-faint); }

  /* 自定义下拉箭头 / 日历图标（覆盖原生控件箭头） */
  .select-wrap, .date-wrap { position: relative; }
  .select-wrap select {
    appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 40px;
  }
  .select-wrap .affix, .date-wrap .affix {
    position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
    display: grid; place-items: center; color: var(--ink-faint);
    pointer-events: none; transition: color .18s, transform .18s;
  }
  .select-wrap:focus-within .affix { color: var(--brand); transform: translateY(-50%) translateY(1px); }
  .date-wrap input { padding-right: 40px; }

  .seg {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    background: rgba(255, 255, 255, 0.4);
    padding: 4px; border-radius: var(--radius-sm);
    border: 1px solid rgba(255, 255, 255, 0.6);
  }
  .seg button {
    height: 42px; border: none; background: transparent; cursor: pointer;
    border-radius: 10px; font-size: 15px; font-family: var(--font);
    color: #3b4658; font-weight: 600;
    transition: color .22s var(--ease-spring), background .22s var(--ease-spring), box-shadow .22s var(--ease-spring);
  }
  .seg button:not(.active):hover { color: var(--brand); background: rgba(255, 255, 255, 0.5); }
  /* 选中态用品牌色实心：年轻人需要「一眼看出选了哪个」，浅色药丸对比太弱 */
  .seg button.active {
    background: linear-gradient(135deg, var(--brand-info), var(--brand));
    color: #fff;
    box-shadow: 0 4px 12px -3px rgba(10, 99, 216, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }

  .amount {
    display: flex; align-items: stretch;
    border: 1px solid rgba(255, 255, 255, 0.7); border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.55);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    overflow: hidden; transition: .18s;
  }
  .amount:focus-within {
    background: rgba(255, 255, 255, 0.85); border-color: var(--brand);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 0 0 4px var(--ring);
  }
  .amount__sym {
    display: grid; place-items: center; padding: 0 12px;
    color: var(--ink-soft); font-weight: 600;
    border-right: 1px solid rgba(20, 30, 50, 0.08); background: rgba(255, 255, 255, 0.35);
  }
  .amount input {
    /* min-width:0 必填：否则窄屏下 input 的 min-content 会把「元」后缀挤出容器（overflow:hidden 后直接不可见） */
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    height: 48px; padding: 0 15px; font-size: 18px; font-weight: 600; color: var(--ink);
    font-family: var(--font); font-variant-numeric: tabular-nums; caret-color: var(--brand);
  }
  .amount__unit { display: grid; place-items: center; padding: 0 12px; color: var(--ink-faint); font-size: 13px; }

  /* 金额行可能带内联报错，改为顶部对齐：标签对齐输入框而非整块 */
  .field--stack { align-items: flex-start; }
  .field--stack .field__label { padding-top: 28px; }

  /* 即时内联报错：不等提交，出错当场指出并轻微抖动 */
  .field__error {
    display: none; align-items: center; gap: 5px;
    margin-top: 7px; font-size: 12.5px; font-weight: 600; color: #b8430a;
  }
  .field.is-invalid .field__error { display: flex; }
  .field.is-invalid .field__label { color: var(--danger); }
  .field.is-invalid .control,
  .field.is-invalid .amount {
    border-color: var(--danger);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 0 0 4px rgba(232, 89, 12, 0.16);
  }
  .field.is-invalid { animation: shake .42s cubic-bezier(.36, .07, .19, .97) both; }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  .modal__foot { padding: 6px 22px 16px; }
  .btn-primary {
    position: relative; overflow: hidden;
    width: 100%; height: 52px; border: none; cursor: pointer;
    border-radius: 15px; color: #fff; font-size: 16px; font-weight: 650; font-family: var(--font);
    letter-spacing: .3px;
    background: linear-gradient(135deg, var(--brand-info), var(--brand));
    box-shadow: 0 10px 24px -8px rgba(10, 99, 216, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    transition: transform .14s var(--ease-spring), filter .15s, box-shadow .15s;
  }
  /* 按钮顶部光泽 */
  .btn-primary::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.25), transparent 55%);
  }
  .btn-primary:hover { filter: brightness(1.05); box-shadow: 0 14px 28px -8px rgba(10, 99, 216, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.4); }
  .btn-primary:active { transform: translateY(1px) scale(0.992); }

  /* 悬停微反馈：控件边界略提亮，暗示可交互 */
  .control:hover, .amount:hover, .seg:hover { border-color: rgba(255, 255, 255, 0.9); }

  /* 键盘焦点可见（WCAG 2.4.7）：统一主题色描边 */
  .modal__close:focus-visible,
  .seg button:focus-visible,
  .btn-primary:focus-visible,
  .control:focus-visible,
  .amount input:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
    border-radius: 9px;
  }

  /* —— 无障碍 1：降低透明度 → 玻璃回落实底，仍保留层次 —— */
  @media (prefers-reduced-transparency: reduce) {
    .modal { background: rgba(248, 250, 253, 0.97); backdrop-filter: none; -webkit-backdrop-filter: none; }
    .modal::before { display: none; }
    .scrim { background: rgba(10, 14, 24, 0.45); backdrop-filter: none; -webkit-backdrop-filter: none; }
    .control, .amount, .seg, .amount__sym { background: #fff; }
    .control:focus, .amount:focus-within { background: #fff; }
    .seg button.active { background: var(--brand); }
  }

  /* —— 无障碍 2：减弱动效 → 关闭弹簧/位移/抖动 —— */
  @media (prefers-reduced-motion: reduce) {
    .modal, .scrim { animation: none; }
    .btn-primary, .modal__close, .control, .seg button { transition: none; }
    .control:focus, .amount:focus-within { transform: none; }
    .field.is-invalid { animation: none; }
  }

  /* —— 移动端：18–22 岁用户主要在手机上填，优先保证单手触摸精度 —— */
  @media (max-width: 520px) {
    body { padding: 12px; }
    .modal { width: 100%; border-radius: 22px; }
    .modal__head { padding: 13px 17px 4px; gap: 11px; }
    .modal__body { padding: 2px 17px 0; }
    .modal__foot { padding: 6px 17px 14px; }
    .field { gap: 11px; padding: 5px 0; }
    .field__label { width: 50px; font-size: 13px; }
  }
</style>
</head>
<body>
  <div class="scrim" aria-hidden="true"></div>

  <div class="modal" role="dialog" aria-label="工作室收支登记">
    <div class="modal__head">
      <div class="modal__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7h18M3 12h18M3 17h12"/>
          <path d="M16 15l2 2 4-4"/>
        </svg>
      </div>
      <div class="modal__titles">
        <div class="modal__title">工作室收支登记</div>
        <div class="modal__sub">登记一笔收入或支出流水</div>
      </div>
      <button class="modal__close" aria-label="关闭">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="modal__body">
      <div class="field">
        <label class="field__label">资金池 <span class="req">*</span></label>
        <div class="field__control">
          <div class="select-wrap">
            <select class="control control--hint">
              <option>请先在「配置」中建立资金池</option>
            </select>
            <span class="affix" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </span>
          </div>
        </div>
      </div>

      <div class="field">
        <label class="field__label">日期 <span class="req">*</span></label>
        <div class="field__control">
          <div class="date-wrap">
            <input class="control" type="text" value="2026-11-02" />
            <span class="affix" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/></svg>
            </span>
          </div>
        </div>
      </div>

      <div class="field">
        <label class="field__label">收支 <span class="req">*</span></label>
        <div class="field__control">
          <div class="seg" role="group" aria-label="收支类型">
            <button type="button" data-dir="IN">收入</button>
            <button type="button" data-dir="OUT" class="active">支出</button>
          </div>
        </div>
      </div>

      <div class="field">
        <label class="field__label">科目 <span class="req">*</span></label>
        <div class="field__control">
          <div class="select-wrap">
            <select class="control control--hint"><option>请选择科目</option></select>
            <span class="affix" aria-hidden="true">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </span>
          </div>
        </div>
      </div>

      <div class="field field--stack" id="amountField">
        <label class="field__label" for="amountInput">金额 <span class="req">*</span></label>
        <div class="field__control">
          <div class="amount">
            <span class="amount__sym">¥</span>
            <input id="amountInput" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off" />
            <span class="amount__unit">元</span>
          </div>
          <div class="field__error" id="amountError">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.4v.2"/></svg>
            请填写金额，且需大于 0
          </div>
        </div>
      </div>

      <div class="field">
        <label class="field__label">备注</label>
        <div class="field__control">
          <textarea class="control" placeholder="补充说明（选填）"></textarea>
        </div>
      </div>
    </div>

    <div class="modal__foot">
      <button class="btn-primary">登记入账</button>
    </div>
  </div>

  <script>
    // 分段控件切换（同步 aria-pressed，键盘/读屏可感知当前选择）
    document.querySelectorAll('.seg button').forEach((btn) => {
      btn.setAttribute('aria-pressed', btn.classList.contains('active') ? 'true' : 'false');
      btn.addEventListener('click', () => {
        btn.parentElement.querySelectorAll('button').forEach((b) => {
          b.classList.remove('active');
          b.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
      });
    });

    const amountField = document.getElementById('amountField');
    const amountInput = document.getElementById('amountInput');
    const submitBtn = document.querySelector('.btn-primary');

    // 输入即清掉报错，不让人一直盯着红框
    amountInput.addEventListener('input', clearError);

    function showError() {
      amountField.classList.remove('is-invalid');
      void amountField.offsetWidth; // 强制重排以重启动画
      amountField.classList.add('is-invalid');
      amountInput.focus();
    }
    function clearError() { amountField.classList.remove('is-invalid'); }

    // 即时校验：金额为空或非正数，提交当场指出而不是静默失败
    submitBtn.addEventListener('click', () => {
      const v = Number(amountInput.value);
      if (!amountInput.value.trim() || !Number.isFinite(v) || v <= 0) { showError(); return; }
      clearError();
      submitBtn.textContent = '已登记 ✓';
      setTimeout(() => { submitBtn.textContent = '登记入账'; }, 1400);
    });
  </script>
</body>
</html>
