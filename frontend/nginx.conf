# 生产站点配置：80 与 443 同时提供服务。
#
# 当前状态（2026-10-27）：服务器已具备 HTTPS 能力，但公网 443 流量在国内网络被
# 中间设备阻断（TCP 握手被抢先应答、ClientHello 之后无响应，服务器侧 nftables
# 入站计数为 0，说明包未到达主机）。因此 80 不能做 301 跳转——那会把所有访问者
# 送到一个打不开的地址。待备案域名或安全组/线路确认可用后，再把 80 改为跳转版本。
#
# 安全边界：443 在此阶段不构成风险（不可达），一旦可达即自动生效，无需再改配置。
# 两个 server 块的 location 集合必须保持同步，改动时一并修改。
#
# 为什么 TLS 在容器内终止而不是宿主机反代：$remote_addr 保持客户端真实地址，
# nginx.global.conf 的 login / api / perip 三个限流 zone 才按真实 IP 生效；
# 多插一层反代会把来源退化成 127.0.0.1，按 IP 限流形同失效。
#
# 证书由 deploy/scripts/gen_selfsigned.sh 生成，运行时挂载到 /etc/nginx/certs。

server {
    listen 80;
    server_name _;

    # 安全响应头见 snippets/security-headers.conf。
    # 注意：任何自带 add_header 的 location 都必须再次 include 该片段，
    # 否则会因 nginx 的继承阻断而拿不到这些头。
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 20m;
    limit_conn perip 30;

    root /usr/share/nginx/html;
    index index.html;

    # 保留 ACME http-01 校验路径，未来上域名时可直接签发证书。
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # SPA 前端路由兜底（刷新子路由不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never let a shared browser or proxy retain an authenticated application
    # shell or an API response containing operational data.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Interactive API metadata is not part of the public service surface.
    # FastAPI also disables it in production as a defence in depth measure.
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    # 后端 API 反向代理（与前端同源，浏览器无跨域）
    # proxy_pass 不带尾斜杠，保留原始 /api 前缀转发给后端
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api burst=60 nodelay;
        add_header Cache-Control "no-store" always;
        proxy_pass http://backend:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Tight, per-IP throttling for password verification.  Excess attempts
    # receive HTTP 429 before reaching the application.
    location = /api/auth/login {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        add_header Cache-Control "no-store" always;
        proxy_pass http://backend:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    # 自签证书期间不加 HSTS：HSTS 会让浏览器长期拒绝降级访问，
    # 一旦证书或部署出问题将无法回到 HTTP 应急。换正式证书后再评估。

    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 20m;
    limit_conn perip 30;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=api burst=60 nodelay;
        add_header Cache-Control "no-store" always;
        proxy_pass http://backend:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/auth/login {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        add_header Cache-Control "no-store" always;
        proxy_pass http://backend:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
