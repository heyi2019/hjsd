server {
    listen 80;
    server_name _;

    # The public-IP release is HTTP-only until a domain and certificate are
    # configured. HSTS is intentionally not sent here: it belongs on HTTPS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Vite bundles scripts locally. Inline styles remain permitted because the
    # UI library generates them at runtime; inline scripts remain forbidden.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    client_max_body_size 20m;
    limit_conn perip 30;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 前端路由兜底（刷新子路由不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never let a shared browser or proxy retain an authenticated application
    # shell or an API response containing operational data.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Interactive API metadata is not part of the public service surface.
    # FastAPI also disables it in production as a defence in depth measure.
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    # 后端 API 反向代理（与前端同源，浏览器无跨域）
    # proxy_pass 不带尾斜杠，保留原始 /api/v1 前缀转发给后端
    location /api/v1/ {
        limit_req zone=api burst=60 nodelay;
        add_header Cache-Control "no-store" always;
        proxy_pass http://backend:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Tight, per-IP throttling for password verification.  Excess attempts
    # receive HTTP 429 before reaching the application.
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        add_header Cache-Control "no-store" always;
        proxy_pass http://backend:8123;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
