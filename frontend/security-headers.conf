# 安全响应头公共片段。
#
# 为什么需要单独抽出来：nginx 的 add_header 一旦在某层级出现，就完全停止向上继承
# （没有合并语义）。因此凡是自己带了 add_header 的 location（/index.html、
# /api/、/api/auth/login），都必须显式 include 本片段，否则承载应用的 HTML
# 与 API 响应将拿不到任何防护头——这正是改造前的实际状态。
#
# 本文件放在 /etc/nginx/snippets/ 而非 conf.d/，因为 nginx.global.conf 会
# include conf.d/*.conf 当作站点配置加载，放进去会被当成第二个 server 块。

# HSTS 不在 HTTP 上发送，只在启用 HTTPS 后于 server 块中单独添加。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Vite 本地打包脚本，故 script-src 仅 'self'；UI 库运行时注入内联样式，
# 因此 style-src 保留 'unsafe-inline'。
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
