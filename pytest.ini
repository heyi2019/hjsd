[pytest]
; 测试统一收在仓库根 tests/ 下（backend / frontend / e2e 三处同级），
; 故 rootdir 定为仓库根，nodeid 形如 tests/backend/<file>.py::<func>。
; 运行入口仍以 backend 为 cwd（.venv、.coveragerc 的 source=app、mutmut 均以此为准），
; 由 backend/run_regression.py 与 run_coverage_gate.py 传 ../tests/backend。
testpaths = tests/backend

markers =
    db: 需要 PostgreSQL（由 v1_engine 夹具依赖自动派生，禁止手工添加）
    unit: 纯函数、模型或单个服务行为测试
    integration: 多模块、数据库或应用上下文联动测试
    contract: API、请求/响应或数据契约测试
    regression: 针对已修复问题或关键业务路径的回归测试
    security: 认证、权限、敏感数据和安全边界测试
    slow: 运行时间较长、适合单独执行的测试
